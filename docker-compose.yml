# =============================================================================
# Greenware ERP — self-hosted stack.
#
#   cp .env.example .env     # then edit POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up -d --build
#   open http://localhost:8081
#
# Start order is enforced, not hoped for:
#   postgres (healthy) -> migrate (exits 0) -> api (healthy) -> web
#
# WHY MIGRATIONS ARE NOT MOUNTED INTO /docker-entrypoint-initdb.d:
# that path runs only on a first boot against an empty volume, applies the files
# with no record of what ran, and silently does nothing on every later start —
# so an existing volume never gets 003_fixes.sql. The `migrate` service below
# uses the root Dockerfile instead: ordered, checksummed, recorded in
# public.schema_migrations, and the same command used against managed Postgres.
# =============================================================================

name: greenware-erp

x-pg-env: &pg-env
  POSTGRES_DB: ${POSTGRES_DB:-greenware}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}

x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-greenware}

services:
  postgres:
    image: postgres:16
    container_name: greenware-erp-postgres
    restart: unless-stopped
    environment:
      <<: *pg-env
      # Deterministic initdb: the schema uses to_tsvector('english', ...) and
      # trigram indexes, and a locale-dependent collation changes index order.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5433 so the test suite's default DATABASE_URL (api/src/__tests__/env.ts)
      # points at this container with no extra configuration.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 is deliberate. During initdb the entrypoint runs a
      # temporary server on the unix socket ONLY, so a socket-based pg_isready
      # reports "ready" while initialisation is still running and lets the
      # migration job connect too early. Requiring TCP waits for the real server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-greenware}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    stop_grace_period: 30s

  migrate:
    # Root Dockerfile: psql 16 + db/migrations + infra/scripts/apply-migrations.sh
    build:
      context: .
      dockerfile: Dockerfile
    image: greenware-erp-migrate:local
    container_name: greenware-erp-migrate
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    # A one-shot job. Restarting it on exit 0 would loop forever.
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    image: greenware-erp-api:local
    container_name: greenware-erp-api
    restart: unless-stopped
    environment:
      <<: *database-url
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — openssl rand -hex 32}
      JWT_TTL: ${JWT_TTL:-8h}
      COMPANY_CODE: ${COMPANY_CODE:-GWT}
      DEFAULT_CALENDAR: ${DEFAULT_CALENDAR:-Dubai}
      MARGIN_FLOOR_PCT: ${MARGIN_FLOOR_PCT:-3}
      DOCUMENT_STORE_DIR: /app/storage
      ENTRA_ENABLED: ${ENTRA_ENABLED:-false}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
    ports:
      # 8080 so the test suite's default API_URL (api/src/__tests__/helpers.ts)
      # points at this container with no extra configuration.
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    volumes:
      # api/src/modules/documents.ts writes generated documents to the local
      # filesystem. Without this volume every container restart loses them.
      - docstore:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
    image: greenware-erp-web:local
    container_name: greenware-erp-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "${WEB_HOST_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Demo data. In the `demo` profile, which .env.example switches on via
  # COMPOSE_PROFILES, so a plain `docker compose up` gives a usable login.
  #
  # It inserts the real Greenware staff list from api/src/db/seed.ts with ONE
  # SHARED PASSWORD (SEED_PASSWORD). Never run it against anything real:
  # take `demo` out of COMPOSE_PROFILES before this stack holds live data.
  # ---------------------------------------------------------------------------
  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: api/Dockerfile
      # `npm -w api run seed` is `tsx src/db/seed.ts`, which needs the
      # TypeScript sources and devDependencies that the runtime image omits.
      target: tooling
    image: greenware-erp-tooling:local
    container_name: greenware-erp-seed
    environment:
      <<: *database-url
      SEED_PASSWORD: ${SEED_PASSWORD:-Greenware#2026}
      COMPANY_CODE: ${COMPANY_CODE:-GWT}
      DEFAULT_CALENDAR: ${DEFAULT_CALENDAR:-Dubai}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # `--demo` is required, not optional: api/src/db/seed.ts gates its demo
    # customers behind process.argv.includes('--demo') (seed.ts:51), and without
    # customers there is nothing to raise an enquiry against — the whole app, and
    # the integration test suite, has no entry point.
    command: ["npm", "run", "seed", "--", "--demo"]
    restart: "no"

volumes:
  pgdata:
    name: greenware-erp-pgdata
  docstore:
    name: greenware-erp-docstore
